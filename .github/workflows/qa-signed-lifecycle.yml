name: Signed intake clock rehearsal
on:
  push:
    branches: [qa-signed-intake-registry]
    paths: [qa/signed-lifecycle-trigger.json]
permissions:
  contents: write
concurrency:
  group: qa-signed-clock
  cancel-in-progress: false
jobs:
  reveal-score-publish:
    if: github.repository == 'assassin808/social-sim-arena-e2e-test'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Wait for real deadline then reveal and score
        env:
          SSA_AGE_IDENTITIES: ${{ secrets.SSA_AGE_IDENTITIES }}
        run: python tools/qa_signed_lifecycle.py
      - name: Audit and publish only the isolated registry branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = qa-signed-intake-registry
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add forecasts reveal-receipts qa-signed-lifecycle/report.json
          git diff --cached --quiet && exit 0
          git commit -m 'QA: reveal and score signed clock rehearsal'
          git pull --rebase origin qa-signed-intake-registry
          git fetch origin sealed:refs/remotes/origin/sealed
          python tools/audit_landing.py HEAD^ HEAD
          git push origin HEAD:qa-signed-intake-registry
